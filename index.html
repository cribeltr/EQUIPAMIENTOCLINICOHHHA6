<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Equipamiento Clínico HHHA · Sistema de Gestión</title>
<meta name="description" content="Sistema unificado de gestión de equipamiento clínico — Hospital HHHA. Integra los módulos de Mantención Correctiva y Gestión de Pendientes.">
<style>
/* ============================================================
   Shell unificado — Equipamiento Clínico HHHA
   Reúne dos módulos independientes (cada uno en su propio
   documento, vía <iframe>) bajo una sola navegación.
   ============================================================ */
:root{
  --bg:#eef2f2;
  --brand:#0d4f4f; --brand-700:#0a4242; --brand-600:#0e5d5d; --brand-500:#0a7d7d;
  --brand-tint:#e2f0ef; --accent:#8fe0d4;
  --ink:#13302f; --ink-soft:#4d6463; --on-brand:#eaf4f3; --on-brand-soft:#9fc2c0;
  --line:#dde5e5;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

/* ---- Barra superior ---- */
.topbar{
  flex:0 0 auto;background:var(--brand);color:var(--on-brand);
  border-bottom:3px solid var(--brand-500);
  box-shadow:0 1px 4px rgba(19,48,47,.18);z-index:10;
}
.topbar-in{
  max-width:1340px;margin:0 auto;padding:0 16px;
  display:flex;align-items:center;gap:16px;min-height:54px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;padding:7px 0;flex:0 0 auto}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--brand-500),var(--brand-700));
  border:1px solid rgba(143,224,212,.45);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.brand .mark svg{width:20px;height:20px}
.brand .txt{display:flex;flex-direction:column;line-height:1.15}
.brand .txt b{font-weight:600;letter-spacing:.2px;font-size:14.5px}
.brand .txt small{font-size:11px;color:var(--on-brand-soft);font-weight:400;letter-spacing:.3px}

/* ---- Pestañas / navegación de módulos ---- */
.tabs{display:flex;gap:4px;flex:1 1 auto;flex-wrap:wrap;align-items:center}
.tab{
  display:inline-flex;align-items:center;gap:8px;
  border:0;background:transparent;color:var(--on-brand-soft);
  font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  padding:9px 14px;border-radius:9px;position:relative;transition:background .15s,color .15s;
}
.tab svg{width:16px;height:16px;flex:0 0 auto}
.tab:hover{background:rgba(143,224,212,.12);color:var(--on-brand)}
.tab[aria-selected="true"]{background:var(--brand-tint);color:var(--brand-700);font-weight:600;box-shadow:0 1px 3px rgba(19,48,47,.25)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.spacer{flex:1 1 auto}
.openext{
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  color:var(--on-brand-soft);border:1px solid rgba(143,224,212,.3);
  background:transparent;font-family:inherit;font-size:12.5px;font-weight:500;
  padding:7px 11px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;
}
.openext svg{width:14px;height:14px}
.openext:hover{background:rgba(143,224,212,.12);color:var(--on-brand)}
.openext:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Escenario (donde viven los iframes) ---- */
.stage{flex:1 1 auto;position:relative;min-height:0;background:var(--bg)}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frame[hidden]{display:none}

/* ---- Indicador de carga ---- */
.loader{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:var(--bg);
  color:var(--ink-soft);font-size:13px;z-index:5;
}
.loader[hidden]{display:none}
.loader .ring{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--brand-500);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:560px){
  .brand .txt small{display:none}
  .tab{padding:9px 11px;font-size:13px}
  .openext span{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M3 10h4l1.5-3 2.5 6 1.5-3H21"/><path d="M8 21h8"/><path d="M12 17v4"/>
        </svg>
      </span>
      <span class="txt">
        <b>Equipamiento Clínico HHHA</b>
        <small>Sistema de gestión de equipos</small>
      </span>
    </div>

    <nav class="tabs" role="tablist" aria-label="Módulos del sistema">
      <button class="tab" role="tab" id="tab-correctiva" data-mod="correctiva" aria-selected="false" aria-controls="frame-correctiva">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.7 6.3a4 4 0 0 0-5.4 5.3L3 18l3 3 6.4-6.3a4 4 0 0 0 5.3-5.4l-2.5 2.5-2.1-2.1z"/>
        </svg>
        Mantención Correctiva
      </button>
      <button class="tab" role="tab" id="tab-pendientes" data-mod="pendientes" aria-selected="false" aria-controls="frame-pendientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4"/>
        </svg>
        Pendientes
      </button>
    </nav>

    <span class="spacer"></span>
    <button class="openext" id="openExt" type="button" title="Abrir el módulo actual en una pestaña nueva">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      </svg>
      <span>Abrir en pestaña</span>
    </button>
  </div>
</header>

<main class="stage" id="stage">
  <iframe class="frame" id="frame-correctiva" role="tabpanel" aria-labelledby="tab-correctiva"
          title="Módulo de Mantención Correctiva" data-src="modulos/mantencion-correctiva.html" hidden></iframe>
  <iframe class="frame" id="frame-pendientes" role="tabpanel" aria-labelledby="tab-pendientes"
          title="Módulo de Gestión de Pendientes" data-src="modulos/pendientes.html" hidden></iframe>
  <div class="loader" id="loader" hidden><div class="ring" aria-hidden="true"></div><span>Cargando módulo…</span></div>
</main>

<script>
(function(){
  "use strict";

  var MODS = {
    correctiva: { file:"modulos/mantencion-correctiva.html", label:"Mantención Correctiva" },
    pendientes: { file:"modulos/pendientes.html",            label:"Gestión de Pendientes" }
  };
  var ORDER = ["correctiva","pendientes"];
  var STORE = "hhha_shell_v1";

  var loader = document.getElementById("loader");
  var openExt = document.getElementById("openExt");
  var current = null;

  function tabEl(id){ return document.getElementById("tab-"+id); }
  function frameEl(id){ return document.getElementById("frame-"+id); }

  // Carga perezosa: el src real se asigna sólo al activar por primera vez.
  function ensureLoaded(id){
    var f = frameEl(id);
    if(!f.getAttribute("src") && f.dataset.src){
      loader.hidden = false;
      f.addEventListener("load", function(){ loader.hidden = true; }, { once:true });
      f.setAttribute("src", f.dataset.src);
    }
  }

  function activate(id, push){
    if(!MODS[id]) id = ORDER[0];
    current = id;
    ORDER.forEach(function(k){
      var on = (k === id);
      tabEl(k).setAttribute("aria-selected", on ? "true" : "false");
      tabEl(k).tabIndex = on ? 0 : -1;
      frameEl(k).hidden = !on;
    });
    loader.hidden = true;
    ensureLoaded(id);
    document.title = MODS[id].label + " · Equipamiento Clínico HHHA";
    try{ localStorage.setItem(STORE, id); }catch(e){}
    if(push !== false && location.hash.slice(1) !== id){
      history.replaceState(null, "", "#" + id);
    }
  }

  function initialMod(){
    var h = location.hash.slice(1);
    if(MODS[h]) return h;
    try{ var s = localStorage.getItem(STORE); if(MODS[s]) return s; }catch(e){}
    return ORDER[0];
  }

  // Click en pestañas
  ORDER.forEach(function(k){
    tabEl(k).addEventListener("click", function(){ activate(k); });
  });

  // Navegación por teclado dentro de la lista de pestañas (patrón ARIA)
  document.querySelector(".tabs").addEventListener("keydown", function(e){
    var i = ORDER.indexOf(current);
    if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
      e.preventDefault();
      var n = e.key === "ArrowRight" ? (i+1)%ORDER.length : (i-1+ORDER.length)%ORDER.length;
      activate(ORDER[n]); tabEl(ORDER[n]).focus();
    }
  });

  // Alt+1 / Alt+2 como atajos globales
  document.addEventListener("keydown", function(e){
    if(e.altKey && !e.ctrlKey && !e.metaKey){
      if(e.key === "1"){ e.preventDefault(); activate(ORDER[0]); tabEl(ORDER[0]).focus(); }
      else if(e.key === "2"){ e.preventDefault(); activate(ORDER[1]); tabEl(ORDER[1]).focus(); }
    }
  });

  // Soporte de enlaces directos / botones atrás-adelante
  window.addEventListener("hashchange", function(){
    var h = location.hash.slice(1);
    if(MODS[h] && h !== current) activate(h, false);
  });

  // Abrir módulo actual en pestaña nueva (uso a pantalla completa)
  openExt.addEventListener("click", function(){
    if(current && MODS[current]) window.open(MODS[current].file, "_blank", "noopener");
  });

  activate(initialMod(), false);
})();
</script>
</body>
</html>
