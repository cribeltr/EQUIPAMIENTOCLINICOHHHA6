<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Pendientes · Equipos Médicos</title>
<style>
:root{
  --bg:#eef1f3; --surface:#fff; --ink:#16242b; --muted:#5c6b73; --line:#dde3e7;
  --grid:#d6dde1; --head:#22424d; --head-h:#2c5562;
  --accent:#0e7c86; --accent-d:#0b626a; --accent-soft:#e2f0f1; --sel:#eaf6f5;
  --venc:#c0392b; --venc-bg:#fbeae8; --hoy:#bd7411; --hoy-bg:#fbf0df;
  --vig:#2e7d52; --vig-bg:#e9f3ec; --comp:#6b7a82; --comp-bg:#eef2f4;
  --proc:#2f6fb0; --proc-bg:#e8f0f9; --esp:#bd7411; --esp-bg:#fbf0df; --todo:#5c6b73; --todo-bg:#eef2f4;
  --pa:#c0392b; --pm:#bd7411; --pb:#4f86a0;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(22,36,43,.06),0 2px 8px rgba(22,36,43,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.mono{font-family:var(--mono)}

.appbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;border-bottom:3px solid var(--accent)}
.appbar-in{max-width:1340px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px}
.brand .mark{width:26px;height:30px;border:2px solid var(--accent);border-radius:4px;position:relative;flex:0 0 auto}
.brand .mark::before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:14px;height:7px;background:var(--accent);border-radius:3px}
.brand .mark::after{content:"";position:absolute;left:5px;right:5px;top:7px;height:2px;background:#fff;box-shadow:0 5px 0 #cfd8dc,0 10px 0 #cfd8dc}
.brand small{display:block;font-weight:400;font-size:11px;color:#9fb3b8;letter-spacing:.3px}
.appbar .spacer{flex:1}
.today{font-family:var(--mono);font-size:12px;color:#aebfc4;white-space:nowrap}
.saved{font-size:11px;color:#7fd1c4;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:#48b89a}
.btn{border:1px solid transparent;border-radius:7px;padding:7px 12px;font-size:13px;font-weight:500;background:#26424d;color:#eaf1f2;transition:background .15s}
.btn:hover{background:#31525f}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;border-color:#3a5a66;color:#cfe0e3}.btn.ghost:hover{background:#26424d}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:170px;padding:6px;display:none;z-index:50}
.menu-pop.show{display:block}
.menu-pop button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px 11px;border-radius:7px;color:var(--ink);font-size:13px}
.menu-pop button:hover{background:var(--accent-soft);color:var(--accent-d)}

.wrap{max-width:1340px;margin:0 auto;padding:16px 20px 64px}
.kpis{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.kpi{flex:1 1 110px;min-width:108px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--accent)}
.kpi.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.kpi .n{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.4px}
.kpi .edge{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi.k-todo .n{color:var(--todo)}.kpi.k-proc .n{color:var(--proc)}.kpi.k-esp .n{color:var(--esp)}
.kpi.k-venc .n{color:var(--venc)}.kpi.k-comp .n{color:var(--comp)}.kpi.k-dup .n{color:#9a4b9a}
.kpi.k-todo .edge{background:var(--todo)}.kpi.k-proc .edge{background:var(--proc)}.kpi.k-esp .edge{background:var(--esp)}
.kpi.k-venc .edge{background:var(--venc)}.kpi.k-comp .edge{background:var(--comp)}.kpi.k-tot .edge{background:var(--ink)}.kpi.k-dup .edge{background:#9a4b9a}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg{display:inline-flex;background:#eef2f4;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--accent-d);box-shadow:var(--shadow)}
.seg svg{width:15px;height:15px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fbfcfc}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.search input{border:0;outline:0;background:transparent;width:100%}
.search svg{flex:0 0 auto;color:var(--muted)}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fbfcfc;color:var(--ink);max-width:180px}
.toolbar select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);user-select:none;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--venc);width:16px;height:16px}
.count-line{font-size:12.5px;color:var(--muted);margin:0 2px 9px}
.count-line b{color:var(--ink);font-family:var(--mono)}

/* badges */
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.pill.s-vencido{background:var(--venc-bg);color:var(--venc)}.pill.s-hoy{background:var(--hoy-bg);color:var(--hoy)}
.pill.s-vigente{background:var(--vig-bg);color:var(--vig)}.pill.s-completado{background:var(--comp-bg);color:var(--comp)}
.est{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.est::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.est.e-todo{background:var(--todo-bg);color:#4a5860}.est.e-proc{background:var(--proc-bg);color:var(--proc)}
.est.e-esp{background:var(--esp-bg);color:var(--esp)}.est.e-comp{background:var(--vig-bg);color:var(--vig)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;white-space:nowrap}
.flag::before{content:"▰";font-size:9px}
.flag.p-Alta{color:var(--pa)}.flag.p-Media{color:var(--pm)}.flag.p-Baja{color:var(--pb)}
.prog{height:5px;background:#e7ecee;border-radius:4px;overflow:hidden;margin-top:7px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog.done>i{background:var(--vig)}
.progtxt{font-size:10.5px;color:var(--muted);font-family:var(--mono)}

/* TABLE */
.tablewrap{background:var(--surface);border:1px solid var(--grid);border-radius:10px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 250px);min-height:280px}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
thead th{position:sticky;top:0;z-index:5;background:var(--head);color:#eef4f5;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:9px 10px;border-right:1px solid #3a5763;border-bottom:2px solid var(--accent);white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}thead th.sortable:hover{background:var(--head-h)}
thead th .ar{opacity:.4;font-size:10px;margin-left:3px}thead th.act-sort .ar{opacity:1;color:#8fe0d4}
.rsz{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:7;touch-action:none}
.rsz:hover{background:linear-gradient(90deg,transparent,rgba(143,224,212,.7))}.rsz.active{background:linear-gradient(90deg,transparent,rgba(143,224,212,.95))}
body.col-resizing,body.col-resizing *{cursor:col-resize!important;user-select:none}
th.c-chk,td.c-chk{width:34px;text-align:center}th.c-num,td.c-num{width:32px;text-align:right;color:var(--muted);font-family:var(--mono);font-size:11px;padding-right:8px}
th.c-pri,td.c-pri{width:40px;text-align:center}th.c-car,td.c-car{width:30px;text-align:center}
tbody td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:7px 10px;vertical-align:middle;background:#fff}
tr.row td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr.row{cursor:pointer}tbody tr.row:hover td{background:#f5f9fa}tbody tr.row.open td{background:var(--sel)}
tbody tr.row.sel td{background:#fff7e9}
td.c-num{border-left:4px solid transparent}
tr.s-vencido td.c-num{border-left-color:var(--venc)}tr.s-hoy td.c-num{border-left-color:var(--hoy)}
tr.s-vigente td.c-num{border-left-color:var(--vig)}tr.s-completado td.c-num{border-left-color:var(--comp)}
tr.s-completado.row td{color:#90a0a6}
.t-equipo{font-weight:600;white-space:nowrap}.t-tipo{color:#3a4a51}
.dias-c{font-family:var(--mono);font-weight:700}.dias-c.v{color:var(--venc)}.dias-c.h{color:var(--hoy)}
.car{display:inline-block;color:var(--muted);transition:transform .15s;font-size:11px}tr.row.open .car{transform:rotate(90deg);color:var(--accent)}
.dupdot{color:#b85a14;font-weight:800;margin-left:5px}
.priflag{display:inline-block;width:14px;height:14px;border-radius:3px;line-height:14px;font-size:9px;font-weight:800;color:#fff;text-align:center}
.priflag.p-Alta{background:var(--pa)}.priflag.p-Media{background:var(--pm)}.priflag.p-Baja{background:var(--pb)}
tr.grouphdr td{background:#f1f5f6;font-weight:700;color:var(--ink);border-bottom:2px solid var(--grid);font-size:12.5px;letter-spacing:.2px;padding:8px 12px}
tr.grouphdr .gc{color:var(--muted);font-weight:600;font-family:var(--mono);margin-left:7px}

/* detail row */
tr.detail-row td{padding:0;border-bottom:1px solid var(--grid);background:#fff;overflow:visible;white-space:normal}
tr.detail-row .panel{padding:16px 20px;background:linear-gradient(180deg,#fbfdfd,#f7fafa);border-left:4px solid var(--accent)}
tr.detail-row.s-vencido .panel{border-left-color:var(--venc)}tr.detail-row.s-hoy .panel{border-left-color:var(--hoy)}tr.detail-row.s-completado .panel{border-left-color:var(--comp)}
.dgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.dlabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px}
.ddesc{font-size:13.5px;color:#28373e;margin-bottom:14px}
.tasks{display:flex;flex-direction:column;gap:5px}
.task{display:flex;align-items:flex-start;gap:9px;text-align:left;width:100%;border:0;background:transparent;padding:5px 7px;border-radius:7px;color:#27363d;font-size:13px;transition:background .12s}
.task:hover{background:#eef4f4}
.task .box{flex:0 0 auto;width:18px;height:18px;border:1.6px solid #b9c4ca;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
.task.t-hecho .box{background:var(--vig);border-color:var(--vig);color:#fff}.task.t-hecho .txt{text-decoration:line-through;color:#95a3a9}
.task.t-no .box{background:var(--venc);border-color:var(--venc);color:#fff}.task.t-na .box{background:#c2ccd1;border-color:#c2ccd1;color:#fff}.task.t-na .txt{color:#9aa7ad}.task .txt{flex:1}
.kv{display:flex;flex-direction:column;gap:9px}.kv .r{font-size:12.5px;color:var(--muted)}.kv .r b{display:block;color:var(--ink);font-weight:500;font-size:13px;margin-top:1px}
.nota{margin-top:8px;font-size:11.5px;font-style:italic;color:#8a4a14;background:#fcefe3;border:1px solid #f3dcc8;padding:7px 10px;border-radius:7px}
.nota.dup{color:#8a3a14;background:#fce9e3;border-color:#f3cdc0}.nota.comp{color:#2f6b46;background:#e7f3ec;border-color:#cfe6d8;font-style:normal}
.log{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.log .li{font-size:11.5px;color:var(--muted);display:flex;gap:8px;padding:2px 0}
.log .li time{font-family:var(--mono);color:#9aa7ad;flex:0 0 auto}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:13px;border-top:1px dashed var(--line)}
.act{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;color:#33454c;transition:.12s}
.act:hover{border-color:var(--accent);color:var(--accent-d)}.act.done{border-color:#bfe0cd;color:var(--vig)}.act.done:hover{background:var(--vig-bg)}.act.del:hover{border-color:#e6b3ac;color:var(--venc);background:var(--venc-bg)}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;align-items:start}
.kcol{background:#e9edef;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;min-height:200px;max-height:calc(100vh - 250px)}
.kcol.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:#e3eff0}
.kcol-h{padding:11px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid;border-radius:11px 11px 0 0;font-weight:700;font-size:13px;position:sticky;top:0;background:inherit}
.kcol-h .cnt{font-family:var(--mono);font-size:12px;background:#fff;border-radius:20px;padding:1px 9px;color:var(--muted)}
.kcol.c-todo .kcol-h{border-color:var(--todo);color:#42505a}.kcol.c-proc .kcol-h{border-color:var(--proc);color:var(--proc)}
.kcol.c-esp .kcol-h{border-color:var(--esp);color:var(--esp)}.kcol.c-comp .kcol-h{border-color:var(--vig);color:var(--vig)}
.kbody{padding:10px;display:flex;flex-direction:column;gap:9px;overflow:auto}
.kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pm);border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:grab}
.kcard:active{cursor:grabbing}.kcard.drag{opacity:.45}
.kcard.p-Alta{border-left-color:var(--pa)}.kcard.p-Media{border-left-color:var(--pm)}.kcard.p-Baja{border-left-color:var(--pb)}
.kcard .kt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kcard .keq{font-weight:600;font-size:13px}
.kcard .kcodes{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px}
.kcard .kmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.kcard .ktipo{font-size:10.5px;color:#46555c;background:var(--accent-soft);padding:1px 7px;border-radius:20px}
.kempty{color:#9aa7ad;font-size:12px;text-align:center;padding:16px 8px}

/* CALENDAR */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-head h3{margin:0;font-size:17px;min-width:170px;text-align:center;text-transform:capitalize}
.cal-nav{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;color:var(--ink)}
.cal-nav:hover{border-color:var(--accent);color:var(--accent-d)}
.cal-grid{background:var(--surface);border:1px solid var(--grid);border-radius:11px;box-shadow:var(--shadow);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--head);color:#dfeaec}
.cal-dow div{padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;text-align:left;border-right:1px solid #3a5763}
.cal-weeks{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:104px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:6px 7px;background:#fff;display:flex;flex-direction:column;gap:4px}
.cal-cell.out{background:#fafbfc}.cal-cell.today{background:#f3fbfb;box-shadow:inset 0 0 0 2px var(--accent-soft)}
.cal-dn{font-family:var(--mono);font-size:12px;color:var(--muted);align-self:flex-start}
.cal-cell.today .cal-dn{color:var(--accent-d);font-weight:700}
.cal-cell.out .cal-dn{color:#b9c4ca}
.cev{font-size:10.5px;padding:2px 7px;border-radius:6px;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cev.s-vencido{background:var(--venc)}.cev.s-hoy{background:var(--hoy)}.cev.s-vigente{background:var(--vig)}.cev.s-completado{background:var(--comp)}
.cev-more{font-size:10.5px;color:var(--accent-d);cursor:pointer;font-weight:600}
.cal-foot{font-size:11.5px;color:var(--muted);margin-top:9px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px}.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.lg .v{background:var(--venc)}.lg .h{background:var(--hoy)}.lg .g{background:var(--vig)}.lg .c{background:var(--comp)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(16,30,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:26px 16px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.modal h2{margin:0;padding:17px 22px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal h2 .x{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1;padding:2px 6px;border-radius:6px}
.modal h2 .x:hover{background:#f0f3f4;color:var(--ink)}
.mbody{padding:18px 22px;max-height:64vh;overflow:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fbfcfc;color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:#fff}
.field textarea{resize:vertical;min-height:54px}
.te-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}.te-row input{flex:1}
.te-cyc{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fbfcfc;font-weight:800;font-size:13px}
.te-cyc.t-pendiente{color:#9aa7ad}.te-cyc.t-hecho{background:var(--vig);border-color:var(--vig);color:#fff}.te-cyc.t-no{background:var(--venc);border-color:var(--venc);color:#fff}.te-cyc.t-na{background:#c2ccd1;border-color:#c2ccd1;color:#fff}
.te-del{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fbfcfc;color:var(--muted)}.te-del:hover{border-color:#e6b3ac;color:var(--venc)}
.te-add{font-size:13px;color:var(--accent-d);background:transparent;border:1px dashed var(--accent);border-radius:8px;padding:8px;width:100%;margin-top:3px}.te-add:hover{background:var(--accent-soft)}
.mlog{margin-top:4px;background:#fafbfb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:120px;overflow:auto}
.mfoot{padding:13px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fafbfb;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}

/* bulk bar */
.bulkbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;border-radius:11px;box-shadow:0 12px 36px rgba(0,0,0,.3);padding:9px 12px;display:none;align-items:center;gap:10px;z-index:55;flex-wrap:wrap;max-width:94vw}
.bulkbar.show{display:flex;transform:translateX(-50%) translateY(0)}
.bulkbar .bc{font-size:13px;font-weight:600;font-family:var(--mono);padding:0 4px}
.bulkbar select{border:1px solid #3a5a66;background:#26424d;color:#eaf1f2;border-radius:7px;padding:6px 8px;font-size:12.5px}
.bulkbar button{border:1px solid #3a5a66;background:#26424d;color:#eaf1f2;border-radius:7px;padding:6px 11px;font-size:12.5px}
.bulkbar button:hover{background:#31525f}.bulkbar button.del:hover{background:var(--venc);border-color:var(--venc)}

.empty{text-align:center;padding:54px 20px;color:var(--muted)}.empty .ic{font-size:38px;opacity:.5}.empty h3{color:var(--ink);margin:10px 0 4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{border-left:4px solid #48b89a}.toast.del{border-left:4px solid var(--venc)}
.hide{display:none!important}

.reminder{display:flex;align-items:center;gap:11px;background:#fff4e6;border:1px solid #f3d9b3;border-left:4px solid var(--hoy);border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);flex-wrap:wrap}
.reminder .ri{font-size:18px}
.reminder .rt{font-size:13.5px;color:#7a4a12}.reminder .rt b{color:var(--venc)}
.reminder button{border:1px solid #e0c08a;background:#fff;color:#8a5a18;border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:500}
.reminder button:hover{background:#fff8ef;border-color:var(--hoy)}
.reminder .rx{margin-left:auto;border:0;background:transparent;color:#b08a4a;font-size:18px;padding:0 6px}
.reminder .rx:hover{color:var(--venc);background:transparent}
.cards2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}
.panel2{background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:15px 17px}
.p2h{margin:0 0 13px;font-size:14px;color:var(--ink)}.p2s{font-weight:400;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-left:6px}
.wtable{width:100%;border-collapse:collapse;font-size:13px}
.wtable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.wtable td{padding:8px;border-bottom:1px solid var(--line)}
.wtable .we{font-weight:600}.wtable .wn{font-family:var(--mono);text-align:center;color:#46555c}.wtable .wn.wv{color:var(--venc);font-weight:700}
.wbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#eef2f4;min-width:60px}
.wbar i{display:block}.b-todo{background:var(--todo)}.b-proc{background:var(--proc)}.b-esp{background:var(--esp)}
.wlg{display:inline-flex;gap:14px;margin-top:11px;font-size:11.5px;color:var(--muted)}.lg{display:inline-flex;gap:5px;align-items:center}
.wlg .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.tbar .tl{flex:0 0 42%;font-size:12.5px;color:#3a4a51;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .tt{flex:1;height:9px;background:#eef2f4;border-radius:5px;overflow:hidden}.tbar .tt i{display:block;height:100%;background:var(--accent);border-radius:5px}
.tbar .tn{font-family:var(--mono);font-size:12px;color:var(--muted);width:24px;text-align:right}
@media (max-width:860px){.cards2{grid-template-columns:1fr}}
@media (max-width:980px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.fgrid{grid-template-columns:1fr}.kpi{flex:1 1 calc(50% - 5px)}.wrap{padding:13px 12px 60px}.dgrid{grid-template-columns:1fr;gap:16px}.kanban{grid-template-columns:1fr}.cal-cell{min-height:74px}}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand"><span class="mark"></span><span>Gestión de Pendientes · Equipos Médicos<small>Mantención preventiva y correctiva</small></span></div>
    <div class="spacer"></div>
    <span class="today" id="today"></span>
    <span class="saved" id="saved">Guardado</span>
    <button class="btn primary" onclick="openModal(null)">+ Nuevo</button>
    <div class="menu">
      <button class="btn ghost" onclick="toggleExp()">Exportar ▾</button>
      <div class="menu-pop" id="exp-menu">
        <button onclick="exportXLSX()">Excel (.xlsx)</button>
        <button onclick="exportCSV()">CSV</button>
        <button onclick="exportJSON()">JSON</button>
      </div>
    </div>
    <button class="btn ghost" onclick="document.getElementById('imp').click()">Importar</button>
    <button class="btn ghost" onclick="resetData()">Reiniciar</button>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(event)">
  </div>
</header>

<div class="wrap">
  <div id="reminder"></div>
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="seg">
      <button data-v="tabla" onclick="setView('tabla')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>Tabla</button>
      <button data-v="kanban" onclick="setView('kanban')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="15" rx="1"/></svg>Tablero</button>
      <button data-v="cal" onclick="setView('cal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Calendario</button>
      <button data-v="carga" onclick="setView('carga')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7"/><rect x="12" y="7" width="3" height="11"/><rect x="17" y="13" width="3" height="5"/></svg>Carga</button>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Buscar por equipo, serie, inventario, servicio, tarea…" oninput="setF('q',this.value)">
    </label>
    <select id="f-tipo" onchange="setF('tipo',this.value)"><option value="">Todos los tipos</option></select>
    <select id="f-equipo" onchange="setF('equipo',this.value)"><option value="">Todos los equipos</option></select>
    <select id="f-serv" onchange="setF('serv',this.value)"><option value="">Todos los servicios</option></select>
    <select id="f-ejec" onchange="setF('ejec',this.value)"><option value="">Todos los ejecutores</option></select>
    <select id="f-prio" onchange="setF('prio',this.value)"><option value="">Toda prioridad</option><option>Alta</option><option>Media</option><option>Baja</option></select>
    <span id="grp-wrap"><select id="f-grp" onchange="setF('group',this.value)"><option value="">Sin agrupar</option><option value="equipo">Agrupar: Equipo</option><option value="ejec">Agrupar: Ejecutor</option><option value="estado">Agrupar: Estado</option><option value="prioridad">Agrupar: Prioridad</option></select></span>
    <label class="chk"><input type="checkbox" id="f-venc" onchange="setF('soloVenc',this.checked)">Solo vencidos</label>
  </div>

  <div class="count-line" id="count"></div>

  <div id="v-tabla">
    <div class="tablewrap">
      <table>
        <colgroup><col id="cg0"><col id="cg1"><col id="cg2"><col id="cg3"><col id="cg4"><col id="cg5"><col id="cg6"><col id="cg7"><col id="cg8"><col id="cg9"><col id="cg10"><col id="cg11"></colgroup>
        <thead><tr>
          <th class="c-chk"><input type="checkbox" id="selall" onclick="selAll(this.checked)" title="Seleccionar todo"></th>
          <th class="c-num">#</th>
          <th class="c-pri sortable" data-c="prioridad" onclick="sortBy('prioridad')" title="Prioridad">P<span class="ar"></span></th>
          <th class="sortable" data-c="equipo" onclick="sortBy('equipo')">Equipo<span class="ar"></span><span class="rsz" data-ci="3"></span></th>
          <th class="sortable" data-c="serie" onclick="sortBy('serie')">Serie<span class="ar"></span><span class="rsz" data-ci="4"></span></th>
          <th>N° Inv.<span class="rsz" data-ci="5"></span></th>
          <th class="sortable" data-c="tipo" onclick="sortBy('tipo')">Tipo<span class="ar"></span><span class="rsz" data-ci="6"></span></th>
          <th class="sortable" data-c="fc" onclick="sortBy('fc')">Compromiso<span class="ar"></span><span class="rsz" data-ci="7"></span></th>
          <th class="sortable" data-c="dias" onclick="sortBy('dias')">Días<span class="ar"></span></th>
          <th class="sortable" data-c="estado" onclick="sortBy('estado')">Estado<span class="ar"></span><span class="rsz" data-ci="9"></span></th>
          <th class="sortable" data-c="ejec" onclick="sortBy('ejec')">Ejecutor<span class="ar"></span><span class="rsz" data-ci="10"></span></th>
          <th class="c-car"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="v-kanban" class="hide"></div>
  <div id="v-cal" class="hide"></div>
  <div id="v-carga" class="hide"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <h2><span id="m-title">Nuevo pendiente</span><button class="x" onclick="closeModal()" aria-label="Cerrar">×</button></h2>
    <div class="mbody">
      <div class="fgrid">
        <div class="field full"><label>Equipo</label><input id="m-equipo" list="dl-equipo" placeholder="Ej: Ventilador Mecánico"></div>
        <div class="field"><label>Serie</label><input id="m-serie" placeholder="Ej: ASFN-0008"></div>
        <div class="field"><label>N° Inventario</label><input id="m-inv" placeholder="Ej: 2-013590" oninput="lookupInv()"></div>
        <div class="field"><label>Servicio clínico</label><input id="m-serv" list="dl-serv" placeholder="Ej: UCI, Pabellón, Diálisis…"></div>
        <div class="field full"><label>Folio SIGEM (opcional · enlaza con el expediente correctivo)</label><input id="m-folio" placeholder="Ej: 2025-121109-19-10024"></div>
        <div class="field"><label>Tipo de pendiente</label>
          <select id="m-tipo" onchange="applyTipoTemplate()"><option>Protocolo Interno de Mantenimiento</option><option>Protocolo Externo de Mantenimiento</option><option>Reprogramación Mantención Preventiva</option><option>Pendiente documental (Reporte no recibido)</option><option>Otro</option></select></div>
        <div class="field"><label>Fecha compromiso</label><input id="m-fc" type="date"></div>
        <div class="field"><label>Estado</label><select id="m-estado"><option>Por hacer</option><option>En proceso</option><option>En espera</option><option>Completado</option></select></div>
        <div class="field"><label>Prioridad</label><select id="m-prio"><option>Alta</option><option>Media</option><option>Baja</option></select></div>
        <div class="field"><label>Responsable ejecutivo (en doc.: consigue el reporte)</label><input id="m-ejec" list="dl-pers" placeholder="Ej: Personal Externo"></div>
        <div class="field"><label>Responsable administrativo</label><input id="m-admin" list="dl-pers" value="Cristián Beltrán Oviedo"></div>
        <div class="field"><label>Empresa / proveedor</label><input id="m-empresa" list="dl-emp" placeholder="Ej: Drager, Medtronics…"></div>
        <div class="field"><label>Origen</label><select id="m-origen"><option value="">—</option><option>Visita técnica</option><option>Servicio técnico</option></select></div>
        <div class="field full"><label>En espera de (opcional)</label><input id="m-espera" placeholder="Ej: Luis Hurtado / Medtronic / Drager…"></div>
        <div class="field full"><label>Descripción</label><textarea id="m-desc" placeholder="Qué falta / contexto…"></textarea></div>
        <div class="field full"><label>Tareas</label><div id="m-tasks"></div><button type="button" class="te-add" onclick="addTaskRow()">+ Agregar tarea</button></div>
        <div class="field full"><label>Nota (opcional)</label><input id="m-nota" placeholder="Ej: posible duplicado, tarea propuesta…"></div>
        <div class="field full"><label>Actividad</label><div class="mlog" id="m-log"></div></div>
      </div>
    </div>
    <div class="mfoot">
      <span class="hint">El semáforo (vencido / hoy / vigente) se calcula con la fecha compromiso.</span>
      <div style="display:flex;gap:9px"><button class="btn ghost" style="color:var(--muted);border-color:var(--line)" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveModal()">Guardar</button></div>
    </div>
  </div>
</div>
<datalist id="dl-equipo"></datalist>
<datalist id="dl-serv"></datalist>
<datalist id="dl-pers"></datalist>
<datalist id="dl-emp"></datalist>

  <select onchange="bulkPrio(this.value);this.value=''"><option value="">Prioridad…</option><option>Alta</option><option>Media</option><option>Baja</option></select>

</div>

function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowStamp(){const d=new Date();return todayISO()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function dmy(iso){if(!iso)return '—';const p=String(iso).split(' ')[0].split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:iso;}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function addDays(iso,n){const d=new Date(iso);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function sit(r){
  if(r.estado==='Completado')return{k:'completado',label:'Completado',dias:null};
  if(!r.fc)return{k:'vigente',label:'Sin fecha',dias:null};
  const t=todayISO();
  if(r.fc<t)return{k:'vencido',label:'Vencido',dias:daysBetween(r.fc,t)};
  if(r.fc===t)return{k:'hoy',label:'Vence hoy',dias:0};
  return{k:'vigente',label:'Vigente',dias:daysBetween(t,r.fc)};
}
function prog(r){const tot=(r.tareas||[]).length;if(!tot)return{done:0,tot:0,pct:0};
  const d=r.tareas.filter(x=>x.s==='hecho'||x.s==='na').length;return{done:d,tot,pct:Math.round(d/tot*100)};}

function visible(){
  return data.filter(r=>{
    const s=sit(r);
    if(F.kpi&&['Por hacer','En proceso','En espera','Completado'].includes(F.kpi)&&r.estado!==F.kpi)return false;
    if(F.kpi==='vencido'&&s.k!=='vencido')return false;
    if(F.kpi==='semana'){const t=todayISO(),lim=addDays(t,6);if(r.estado==='Completado'||!r.fc||r.fc>lim)return false;}
    if(F.kpi==='dup'&&!isDup(r))return false;
    if(F.soloVenc&&!(s.k==='vencido'||s.k==='hoy'))return false;
    if(F.tipo&&r.tipo!==F.tipo)return false;
    if(F.equipo&&r.equipo!==F.equipo)return false;
    if(F.serv&&(r.servicio||'')!==F.serv)return false;
    if(F.ejec&&r.ejec!==F.ejec)return false;
    if(F.prio&&r.prioridad!==F.prio)return false;
    if(F.q){const blob=norm([r.equipo,r.serie,r.inv,r.servicio,r.tipo,r.estado,r.prioridad,r.ejec,r.admin,r.esperaDe,r.desc,r.nota,r.gestion,r.folio,r.empresa,r.origen,(r.tareas||[]).map(x=>x.t).join(' ')].join(' '));
      const terms=norm(F.q).split(/\s+/).filter(Boolean);
      if(!terms.every(t=>blob.includes(t)))return false;}
    return true;
  });
}

function cmp(x,y){const c=F.sortCol;
  if(c==='dias'){const sx=sit(x),sy=sit(y);const px=sx.k==='completado'?1:0,py=sy.k==='completado'?1:0;if(px!==py)return px-py;
    const vx=sx.dias==null?-1e9:(sx.k==='vencido'?sx.dias:sx.k==='hoy'?0:-sx.dias);const vy=sy.dias==null?-1e9:(sy.k==='vencido'?sy.dias:sy.k==='hoy'?0:-sy.dias);return vx-vy;}
  if(c==='fc')return (x.fc||'9999-99').localeCompare(y.fc||'9999-99');
  if(c==='estado')return ESTADOS.indexOf(x.estado)-ESTADOS.indexOf(y.estado);
  if(c==='prioridad')return PRORD[x.prioridad]-PRORD[y.prioridad];
  if(c==='equipo')return x.equipo.localeCompare(y.equipo)||x.serie.localeCompare(y.serie);
  if(c==='serie')return x.serie.localeCompare(y.serie);
  if(c==='tipo')return x.tipo.localeCompare(y.tipo);
  if(c==='ejec')return (x.ejec||'').localeCompare(y.ejec||'');
  return 0;}

    return {e,total:c.todo+c.proc+c.esp,todo:c.todo,proc:c.proc,esp:c.esp,comp:c.comp,venc:c.venc};}).sort((a,b)=>b.total-a.total);

    <div class="wlg"><span class="lg"><i style="background:var(--todo)"></i>Por hacer</span><span class="lg"><i style="background:var(--proc)"></i>En proceso</span><span class="lg"><i style="background:var(--esp)"></i>En espera</span></div></div>
    <div class="panel2"><h3 class="p2h">Pendientes por tipo<span class="p2s">abiertos</span></h3>${tipoRows}</div></div>`;
}

function tHeadArrows(){document.querySelectorAll('thead th.sortable').forEach(th=>{const on=th.dataset.c===F.sortCol;th.classList.toggle('act-sort',on);th.querySelector('.ar').textContent=on?(F.sortDir==='desc'?'▼':'▲'):'⇅';});}

  let html='';

          <div class="r">Serie · Inventario<b><span class="mono">${esc(r.serie)}</span> · <span class="mono">${esc(r.inv)||'—'}</span></b></div>
          ${r.folio?`<div class="r">Folio SIGEM<b class="mono">${esc(r.folio)}</b></div>`:''}
          ${(()=>{const e=EQIDX[r.inv];return e&&(e.mk||e.md)?`<div class="r">Marca / Modelo<b>${esc([e.mk,e.md].filter(Boolean).join(' · '))}</b></div>`:'';})()}
          ${r.servicio?`<div class="r">Servicio clínico<b>${esc(r.servicio)}</b></div>`:''}

          <div class="r">Responsable ejecutivo<b>${esc(r.ejec)||'—'}</b></div>
          <div class="r">Responsable administrativo<b>${esc(r.admin)||'—'}</b></div>
          ${r.empresa?`<div class="r">Empresa / proveedor<b>${esc(r.empresa)}</b></div>`:''}

function kcard(r){
  const s=sit(r);const p=prog(r);
  const dias=(s.k==='vencido')?`<span class="pill s-vencido">${s.dias} d</span>`:(s.k==='hoy')?`<span class="pill s-hoy">Hoy</span>`:(s.k==='vigente'&&r.fc)?`<span class="pill s-vigente">${dmy(r.fc)}</span>`:'';

  return `<div class="kcard p-${r.prioridad}" draggable="true" ondragstart="kStart(event,'${r.id}')" ondragend="kEnd(event)" onclick="openModal('${r.id}')">

      <div class="kcodes">${esc(r.serie)} · ${esc(r.inv)||'—'}</div></div>
      <span class="flag p-${r.prioridad}" title="Prioridad ${esc(r.prioridad)}">${esc(r.prioridad[0])}</span></div>

  </div>`;
}
let dragId=null;
function kStart(e,id){dragId=id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',id);}catch(_){}
  e.currentTarget.classList.add('drag');}
function kEnd(e){e.currentTarget.classList.remove('drag');document.querySelectorAll('.kcol.drop').forEach(c=>c.classList.remove('drop'));}
function kOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop');}
function kLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drop');}
function kDrop(e,est){e.preventDefault();e.currentTarget.classList.remove('drop');const id=dragId||e.dataTransfer.getData('text/plain');dragId=null;if(id)setEstado(id,est);}

/* ---------- CALENDAR ---------- */
function renderCal(){
  const c=$('v-cal');
  const first=new Date(cal.y,cal.m,1);
  let start=(first.getDay()+6)%7; // lunes=0
  const dim=new Date(cal.y,cal.m+1,0).getDate();
  const today=todayISO();
  const byDay={};
  visible().forEach(r=>{if(r.fc){const k=r.fc;(byDay[k]=byDay[k]||[]).push(r);}});
  let cells='';
  const prevDim=new Date(cal.y,cal.m,0).getDate();
  for(let i=0;i<start;i++){const d=prevDim-start+1+i;cells+=`<div class="cal-cell out"><span class="cal-dn">${d}</span></div>`;}
  for(let d=1;d<=dim;d++){
    const iso=cal.y+'-'+String(cal.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs=(byDay[iso]||[]);
    const isToday=iso===today;
    let ev=evs.slice(0,3).map(r=>{const s=sit(r);return `<div class="cev s-${s.k}" title="${esc(r.equipo)} · ${esc(r.tipo)}" onclick="openModal('${r.id}')">${esc(r.serie)} · ${esc(r.tipo).slice(0,16)}</div>`;}).join('');
    if(evs.length>3)ev+=`<div class="cev-more" onclick="calDay('${iso}')">+${evs.length-3} más</div>`;
    cells+=`<div class="cal-cell ${isToday?'today':''}"><span class="cal-dn">${d}</span>${ev}</div>`;
  }
  const total=start+dim;const tail=(7-total%7)%7;
  for(let i=1;i<=tail;i++){cells+=`<div class="cal-cell out"><span class="cal-dn">${i}</span></div>`;}
  const noFc=visible().filter(r=>!r.fc).length;
  c.innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" onclick="calMove(-1)">‹</button>
      <h3>${MES[cal.m]} ${cal.y}</h3>
      <button class="cal-nav" onclick="calMove(1)">›</button>
      <button class="btn" style="background:#26424d" onclick="calToday()">Hoy</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">${DOW.map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="cal-weeks">${cells}</div>
    </div>
    <div class="cal-foot">
      <span class="lg"><i class="v"></i>Vencido</span><span class="lg"><i class="h"></i>Vence hoy</span>
      <span class="lg"><i class="g"></i>Vigente</span><span class="lg"><i class="c"></i>Completado</span>
      ${noFc?`<span style="margin-left:auto">· ${noFc} sin fecha compromiso (no aparecen)</span>`:''}
    </div>`;
}
function calMove(d){cal.m+=d;if(cal.m<0){cal.m=11;cal.y--;}if(cal.m>11){cal.m=0;cal.y++;}render();}
function calToday(){const d=new Date();cal.y=d.getFullYear();cal.m=d.getMonth();render();}
function calDay(iso){F.q='';$('q').value='';view='tabla';F.sortCol='fc';F.sortDir='asc';
  // filtrar por ese día via búsqueda de fecha: usamos un filtro simple expandiendo todos de ese día
  render();toast('Mostrando '+dmy(iso)+' en la tabla');
}

/* ---------- interactions ---------- */
function setF(k,v){F[k]=v;render();}
function setView(v){view=v;selected.clear();render();}
function toggleKpi(k){F.kpi=(F.kpi===k?'':k);if(k==='vencido'){$('f-venc').checked=false;F.soloVenc=false;}render();}
function sortBy(c){if(window.__noSort)return;if(F.sortCol===c){F.sortDir=F.sortDir==='asc'?'desc':'asc';}else{F.sortCol=c;F.sortDir=(c==='equipo'||c==='serie'||c==='tipo'||c==='ejec'||c==='fc')?'asc':'desc';}render();}
function toggleRow(id){if(expanded.has(id))expanded.delete(id);else expanded.add(id);render();}
function cycleTask(id,i){const r=data.find(x=>x.id===id);if(!r)return;r.tareas[i].s=TS[(TS.indexOf(r.tareas[i].s)+1)%TS.length];save();render();}
function setEstado(id,est){const r=data.find(x=>x.id===id);if(!r||r.estado===est)return;const prev=r.estado;r.estado=est;
  if(est==='Completado'){r.fcomp=todayISO();logAct(r,'Completado');}
  else{if(prev==='Completado')r.fcomp='';logAct(r,'Estado: '+prev+' → '+est);}
  save();render();toast('Estado: '+est,est==='Completado'?'ok':'');}
function complete(id){setEstado(id,'Completado');}
function setPrio(id,p){const r=data.find(x=>x.id===id);if(!r||r.prioridad===p)return;logAct(r,'Prioridad: '+r.prioridad+' → '+p);r.prioridad=p;save();render();}
function del(id){const r=data.find(x=>x.id===id);if(!r)return;if(!confirm(`¿Eliminar este pendiente?\n\n${r.equipo} · ${r.serie}\n${r.tipo}`))return;
  data=data.filter(x=>x.id!==id);expanded.delete(id);selected.delete(id);save();render();toast('Pendiente eliminado','del');}

/* selection / bulk */
function toggleSel(id){if(selected.has(id))selected.delete(id);else selected.add(id);render();}
function syncSelAll(){const cb=$('selall');if(!cb)return;const rows=visible();const n=rows.filter(r=>selected.has(r.id)).length;
  cb.checked=n>0&&n===rows.length;cb.indeterminate=n>0&&n<rows.length;}
function selAll(on){const rows=visible();if(on)rows.forEach(r=>selected.add(r.id));else rows.forEach(r=>selected.delete(r.id));render();}
function renderBulk(){const b=$('bulkbar');const n=selected.size;b.classList.toggle('show',n>0&&view==='tabla');$('bulkN').textContent=n;}
function bulkEstado(v){if(!v)return;selected.forEach(id=>{const r=data.find(x=>x.id===id);if(r&&r.estado!==v){if(v==='Completado'){r.fcomp=todayISO();logAct(r,'Completado (lote)');}else{if(r.estado==='Completado')r.fcomp='';logAct(r,'Estado → '+v+' (lote)');}r.estado=v;}});save();render();toast(selected.size+' actualizados','ok');}
function bulkPrio(v){if(!v)return;selected.forEach(id=>{const r=data.find(x=>x.id===id);if(r&&r.prioridad!==v){logAct(r,'Prioridad → '+v+' (lote)');r.prioridad=v;}});save();render();toast('Prioridad actualizada','ok');}
function bulkDel(){if(!selected.size)return;if(!confirm(`¿Eliminar ${selected.size} pendientes seleccionados?`))return;data=data.filter(x=>!selected.has(x.id));selected.clear();save();render();toast('Eliminados','del');}
function bulkClear(){selected.clear();render();}

  $('m-folio').value=r?(r.folio||''):'';$('m-empresa').value=r?(r.empresa||''):'';$('m-origen').value=r?(r.origen||''):'';
  modalTasks=r?JSON.parse(JSON.stringify(r.tareas||[])):[];renderTaskEditor();
  const log=r&&r.log&&r.log.length?r.log.slice().reverse().map(l=>`<div class="li"><time>${esc(dmy(l.ts))}</time><span>${esc(l.txt)}</span></div>`).join(''):'<span style="color:#9aa7ad;font-size:12px">Sin actividad aún.</span>';
  $('m-log').innerHTML=log;
  $('overlay').classList.add('show');
}
function closeModal(){$('overlay').classList.remove('show');editingId=null;}
function saveModal(){
  const eq=$('m-equipo').value.trim();
  if(!eq){toast('Falta el equipo','del');$('m-equipo').focus();return;}
  const tareas=modalTasks.filter(t=>t.t.trim()).map(t=>({t:t.t.trim(),s:t.s}));
  const nestado=$('m-estado').value,nprio=$('m-prio').value;
  if(editingId){const r=data.find(x=>x.id===editingId);
    if(r.estado!==nestado)logAct(r,'Estado: '+r.estado+' → '+nestado);
    if(r.prioridad!==nprio)logAct(r,'Prioridad: '+r.prioridad+' → '+nprio);
    Object.assign(r,{equipo:eq,serie:$('m-serie').value.trim(),inv:$('m-inv').value.trim(),servicio:$('m-serv').value.trim(),tipo:$('m-tipo').value,fc:$('m-fc').value,
      estado:nestado,prioridad:nprio,admin:$('m-admin').value.trim(),ejec:$('m-ejec').value.trim(),esperaDe:$('m-espera').value.trim(),
      desc:$('m-desc').value.trim(),nota:$('m-nota').value.trim(),tareas,folio:$('m-folio').value.trim(),empresa:$('m-empresa').value.trim(),origen:$('m-origen').value});
    if(nestado==='Completado'&&!r.fcomp)r.fcomp=todayISO();if(nestado!=='Completado')r.fcomp='';
    logAct(r,'Editado');toast('Cambios guardados','ok');
  }else{const obj={id:'P'+Date.now().toString(36),equipo:eq,serie:$('m-serie').value.trim(),inv:$('m-inv').value.trim(),servicio:$('m-serv').value.trim(),tipo:$('m-tipo').value,fc:$('m-fc').value,
      estado:nestado,prioridad:nprio,admin:$('m-admin').value.trim(),ejec:$('m-ejec').value.trim(),esperaDe:$('m-espera').value.trim(),
      desc:$('m-desc').value.trim(),nota:$('m-nota').value.trim(),tareas,folio:$('m-folio').value.trim(),empresa:$('m-empresa').value.trim(),origen:$('m-origen').value,fcomp:nestado==='Completado'?todayISO():'',gestion:'',creado:todayISO(),log:[{ts:nowStamp(),txt:'Pendiente creado'}]};
    data.unshift(obj);expanded.add(obj.id);toast('Pendiente creado','ok');}
  save();render();closeModal();
}

/* export / import */
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function downloadBytes(name,u8,type){const b=new Blob([u8],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
const CRCT=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let crc=0xFFFFFFFF;for(let i=0;i<u8.length;i++)crc=(crc>>>8)^CRCT[(crc^u8[i])&0xFF];return (crc^0xFFFFFFFF)>>>0;}
function strU8(s){return new TextEncoder().encode(s);}
function zip(files){
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  let parts=[],cd=[],off=0;
  files.forEach(f=>{const nm=strU8(f.name),dt=f.data,crc=crc32(dt);
    const loc=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(dt.length),u32(dt.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(loc),nm,dt);cd.push({nm,crc,len:dt.length,off});off+=loc.length+nm.length+dt.length;});
  let cdStart=off,cdParts=[],cdSize=0;
  cd.forEach(c=>{const h=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(c.crc),u32(c.len),u32(c.len),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cdParts.push(new Uint8Array(h),c.nm);cdSize+=h.length+c.nm.length;});
  const end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(cd.length),u16(cd.length),u32(cdSize),u32(cdStart),u16(0)));
  const all=parts.concat(cdParts,[end]);let tot=all.reduce((a,b)=>a+b.length,0),out=new Uint8Array(tot),p=0;
  all.forEach(c=>{out.set(c,p);p+=c.length;});return out;}
function colL(i){let s='';i++;while(i>0){let m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function exportXLSX(){
  closeExp();
  const MK={pendiente:'[ ]',hecho:'[Sí]',no:'[No]',na:'[—]'};
  const cols=[['Folio SIGEM',22],['Equipo',22],['Serie',14],['N° Inventario',13],['Servicio clínico',20],['Tipo de pendiente',30],['Fecha compromiso',14],['Días de atraso',11],['Situación',12],['Estado',12],['Prioridad',9],['Responsable Ejecutivo',22],['Responsable Administrativo',24],['Empresa / proveedor',20],['Origen',14],['En espera de',16],['Descripción',44],['Tareas',54],['Fecha completado',14],['Creado',12]];
  let hc='';cols.forEach((c,i)=>{hc+=`<c r="${colL(i)}1" s="1" t="inlineStr"><is><t xml:space="preserve">${esc(c[0])}</t></is></c>`;});
  let rowsXml=`<row r="1">${hc}</row>`;
  data.forEach((r,ri)=>{
    const row=ri+2,s=sit(r);
    const dias=(s.k==='vencido')?s.dias:(s.k==='hoy'?0:'');
    const tareas=(r.tareas||[]).map(t=>(MK[t.s]||'[ ]')+' '+t.t).join('\n');
    const vals=[r.folio||'',r.equipo,r.serie,r.inv,r.servicio||'',r.tipo,dmy(r.fc),null,s.label,r.estado,r.prioridad,r.ejec,r.admin,r.empresa||'',r.origen||'',r.esperaDe,r.desc,tareas,dmy(r.fcomp),dmy(r.creado)];
    let cells='';
    vals.forEach((v,i)=>{
      if(i===7){if(dias!=='')cells+=`<c r="${colL(i)}${row}"><v>${dias}</v></c>`;return;}
      const st=(i===16||i===17)?' s="2"':'';
      cells+=`<c r="${colL(i)}${row}"${st} t="inlineStr"><is><t xml:space="preserve">${esc(v==null?'':v)}</t></is></c>`;});
    rowsXml+=`<row r="${row}">${cells}</row>`;});
  const last=colL(cols.length-1),lastRow=data.length+1;
  const colsXml='<cols>'+cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c[1]}" customWidth="1"/>`).join('')+'</cols>';
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    `<dimension ref="A1:${last}${lastRow}"/>`+
    '<sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/>'+colsXml+`<sheetData>${rowsXml}</sheetData>`+`<autoFilter ref="A1:${last}${lastRow}"/></worksheet>`;
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Pendientes" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF22424D"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const files=[{name:'[Content_Types].xml',data:strU8(ct)},{name:'_rels/.rels',data:strU8(rels)},{name:'xl/workbook.xml',data:strU8(wb)},{name:'xl/_rels/workbook.xml.rels',data:strU8(wbr)},{name:'xl/styles.xml',data:strU8(styles)},{name:'xl/worksheets/sheet1.xml',data:strU8(sheet)}];
  downloadBytes('pendientes.xlsx',zip(files),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast('Exportado pendientes.xlsx','ok');
}
function exportJSON(){closeExp();download('pendientes.json',JSON.stringify(data,null,2),'application/json');toast('Exportado pendientes.json','ok');}
function csvCell(v){v=v==null?'':String(v);return '"'+v.replace(/"/g,'""')+'"';}
function exportCSV(){
  closeExp();
  const MK={pendiente:'[ ]',hecho:'[Sí]',no:'[No]',na:'[—]'};
  const head=['Folio SIGEM','Equipo','Serie','N° Inventario','Servicio clínico','Tipo de pendiente','Fecha compromiso','Situación','Estado','Prioridad','Responsable Ejecutivo','Responsable Administrativo','Empresa / proveedor','Origen','En espera de','Descripción','Tareas','Fecha completado','Creado'];
  const lines=[head.map(csvCell).join(',')];
  data.forEach(r=>{const s=sit(r);
    const tareas=(r.tareas||[]).map(t=>(MK[t.s]||'[ ]')+' '+t.t).join('\n');
    lines.push([r.folio||'',r.equipo,r.serie,r.inv,r.servicio||'',r.tipo,dmy(r.fc),s.label,r.estado,r.prioridad,r.ejec,r.admin,r.empresa||'',r.origen||'',r.esperaDe,r.desc,tareas,dmy(r.fcomp),dmy(r.creado)].map(csvCell).join(','));
  });
  download('pendientes.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');toast('Exportado pendientes.csv','ok');
}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;data=arr.map(migrate);save();render();toast('Datos importados','ok');}catch(e){toast('Archivo no válido','del');}};
  rd.readAsText(f);ev.target.value='';}
function resetData(){if(!confirm('¿Restaurar los pendientes originales? Se perderán los cambios guardados en este equipo.'))return;data=JSON.parse(JSON.stringify(SEED)).map(migrate);expanded.clear();selected.clear();save();render();toast('Datos restaurados');}
function toggleExp(){$('exp-menu').classList.toggle('show');}
function closeExp(){$('exp-menu').classList.remove('show');}

/* selects, resize, init */
function fillSelect(id,vals){const s=$(id);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}
function fillDatalist(id,vals){const dl=$(id);if(!dl)return;vals.forEach(v=>{const o=document.createElement('option');o.value=v;dl.appendChild(o);});}
function buildSelects(){
  fillSelect('f-tipo',TIPOS);
  fillSelect('f-equipo',[...new Set(data.map(r=>r.equipo))].sort());
  fillSelect('f-serv',[...new Set(data.map(r=>r.servicio).filter(Boolean))].sort());
  fillSelect('f-ejec',[...new Set(data.map(r=>r.ejec).filter(Boolean))].sort());
  fillDatalist('dl-equipo',[...new Set(EQUIPOS.map(e=>e.eq))].sort());
  fillDatalist('dl-serv',CAT_SERV);
  fillDatalist('dl-pers',CAT_ING);
  fillDatalist('dl-emp',CAT_EMP);
}
const DEFW=[34,32,40,150,105,95,200,105,68,118,150,30];
let COLW=loadCols();
function loadCols(){try{const s=localStorage.getItem('pendientesCols_v2');if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length===12)return a;}}catch(e){}return DEFW.slice();}
function saveCols(){try{localStorage.setItem('pendientesCols_v2',JSON.stringify(COLW));}catch(e){}}
function applyCols(){let tot=0;for(let i=0;i<12;i++){const c=document.getElementById('cg'+i);if(c)c.style.width=COLW[i]+'px';tot+=COLW[i];}const t=document.querySelector('table');if(t)t.style.width=tot+'px';}
function setupResize(){document.querySelectorAll('.rsz').forEach(h=>{
  h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const ci=+h.dataset.ci,sx=e.clientX,sw=COLW[ci];
    window.__noSort=true;h.classList.add('active');document.body.classList.add('col-resizing');try{h.setPointerCapture(e.pointerId);}catch(_){}
    const mv=ev=>{COLW[ci]=Math.round(Math.max(46,sw+(ev.clientX-sx)));applyCols();};
    const up=()=>{try{h.releasePointerCapture(e.pointerId);}catch(_){}h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.classList.remove('active');document.body.classList.remove('col-resizing');saveCols();setTimeout(()=>{window.__noSort=false;},120);};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);});
  h.addEventListener('dblclick',e=>{e.stopPropagation();const ci=+h.dataset.ci;COLW[ci]=DEFW[ci];applyCols();saveCols();});
  h.addEventListener('click',e=>e.stopPropagation());});}
function toast(m,kind){const e=$('toast');e.textContent=m;e.className='toast show '+(kind||'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',2200);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeExp();}});
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeExp();});

(function(){const d=new Date();cal.y=d.getFullYear();cal.m=d.getMonth();})();
load();buildSelects();applyCols();render();setupResize();
